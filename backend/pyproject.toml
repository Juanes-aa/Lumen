[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "E501",  # line too long — los mocks en tests tienen cadenas largas inevitables
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
